apiVersion: keel/v1
kind: Agent
metadata:
  name: careermate-keel
  displayName: CareerMate 职业助手
  owner: 人力数字化组 / guandezhi
  category: biz
spec:
  kind: agent
  interaction:
    mode: chat
  capabilities:
    toolCalling: true
    loop: true
    memory: true
  runtime:
    type: code
    language: python
    endpoint: http://careermate-keel.agents.svc.cluster.local:8000
    liveness: k8s
  auth:
    audience: careermate-keel
  models:
    default: chat-default
    budget:
      dailyCny: 30
      maxSteps: 6
  audit:
    captureFields: [toolName, outcome]
  guardrails:
    inputInjection: enforce
    indirectInjection: shadow
    taintedTool: block
    pii: mask
  tools:
    - name: rag_retriever
      access: read
      risk: mid
      approval: none
    - name: advance_application_stage
      access: write
      risk: low
      approval: none
    - name: get_company_atmosphere
      access: read
      risk: low
      approval: none
    - name: create_career_task
      access: write
      risk: mid
      approval: none
    - name: create_interview_session
      access: write
      risk: mid
      approval: none
    - name: create_job_match
      access: write
      risk: mid
      approval: none
    - name: filter_opportunities
      access: read
      risk: low
      approval: none
    - name: generate_jd_aware_questions
      access: read
      risk: low
      approval: none
    - name: generate_resume_from_jd
      access: read
      risk: high
      approval: required
    - name: get_career_tasks
      access: read
      risk: low
      approval: none
    - name: get_dashboard_overview
      access: read
      risk: low
      approval: none
    - name: get_default_resume
      access: read
      risk: low
      approval: none
    - name: get_latest_job_match
      access: read
      risk: low
      approval: none
    - name: get_pipeline_board
      access: read
      risk: low
      approval: none
    - name: list_resume_versions
      access: read
      risk: low
      approval: none
    - name: mark_career_task_done
      access: write
      risk: mid
      approval: none
    - name: modify_resume
      access: read
      risk: mid
      approval: none
    - name: propose_stage_confirmation
      access: read
      risk: low
      approval: none
    - name: get_salary_guidance
      access: read
      risk: low
      approval: none
    - name: search_knowledge_base
      access: read
      risk: mid
      approval: none
    - name: update_career_profile
      access: write
      risk: mid
      approval: none
  prompts:
    source: langfuse
    label: production
    items:
      - name: assistant
        type: text
      - name: agent-base
        type: text
      - name: resume-generate-from-jd
        type: text
      - name: job-match-analyze
        type: text
      - name: interview-question-generate
        type: text
  eval:
    dataset: careermate/career-lifecycle
    evaluators: [career_quality]
    gate:
      minScore: 0.85
      maxRegression: 0.02
