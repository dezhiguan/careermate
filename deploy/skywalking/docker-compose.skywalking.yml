# Optional SkyWalking OAP + UI for CareerMate / RAGForge shared tracing.
# Start on Server 3 (app layer):
#   SKYWALKING_BIND_IP=172.25.90.184 bash deploy/scripts/start-skywalking.sh
#
# UI (host): http://127.0.0.1:18088/skywalking/
# UI (private, for Server 2 Nginx): http://172.25.90.184:18088/skywalking/
# Agent gRPC (host): 127.0.0.1:11800 and 172.25.90.184:11800 (k8s pods)

services:
  banyandb:
    image: apache/skywalking-banyandb:0.8.0
    container_name: skywalking-banyandb
    restart: unless-stopped
    command: standalone
    networks:
      - skywalking-net

  skywalking-oap:
    image: apache/skywalking-oap-server:10.2.0
    container_name: skywalking-oap
    restart: unless-stopped
    depends_on:
      - banyandb
    ports:
      - "127.0.0.1:11800:11800"
      - "${SKYWALKING_BIND_IP:-127.0.0.1}:11800:11800"
      - "127.0.0.1:12800:12800"
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - skywalking-net

  skywalking-ui:
    image: apache/skywalking-ui:10.2.0
    container_name: skywalking-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    ports:
      - "127.0.0.1:18088:8080"
      - "${SKYWALKING_BIND_IP:-127.0.0.1}:18088:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      # When Nginx serves UI under /skywalking/, set context path (UI 10.x):
      SW_SERVER_SERVLET_CONTEXT_PATH: /skywalking
    networks:
      - skywalking-net

networks:
  skywalking-net:
    name: skywalking-net
    driver: bridge
