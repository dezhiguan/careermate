# Apply independently to staging/prod with distinct names, PVCs, Secrets and endpoints.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: careermate-keel-data
  namespace: agents
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: careermate-keel
  namespace: agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careermate-keel
  template:
    metadata:
      labels:
        app: careermate-keel
        keel.io/agent: careermate-keel
        keel.io/env: staging
    spec:
      hostAliases:
        - ip: "172.25.90.183"
          hostnames: [jp.cloud.langfuse.com]
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent
          image: careermate-agent:VERSION
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: keel-careermate-keel
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /v1/health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /v1/health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /opt/careermate-agent/.keel
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: careermate-keel-data
---
apiVersion: v1
kind: Service
metadata:
  name: careermate-keel
  namespace: agents
spec:
  selector:
    app: careermate-keel
  ports:
    - port: 8000
      targetPort: 8000
