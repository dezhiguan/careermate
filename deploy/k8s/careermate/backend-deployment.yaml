apiVersion: apps/v1
kind: Deployment
metadata:
  name: careermate-backend
  namespace: careermate
  labels:
    app: careermate-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: careermate-backend
  template:
    metadata:
      labels:
        app: careermate-backend
    spec:
      containers:
        - name: backend
          image: careermate/backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 18080
          envFrom:
            - secretRef:
                name: careermate-backend-env
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -javaagent:/opt/skywalking-agent/skywalking-agent.jar
                -Dskywalking.agent.service_name=careermate-backend
                -Dskywalking.collector.backend_service=172.25.90.184:11800
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: skywalking-agent
              mountPath: /opt/skywalking-agent
              readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /opt/careermate/logs/k8s-backend
            type: DirectoryOrCreate
        - name: skywalking-agent
          hostPath:
            path: /opt/skywalking-agent
            type: Directory
