apiVersion: apps/v1
kind: Deployment
metadata:
  name: careermate-backend
  namespace: careermate
  labels:
    app: careermate-backend
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Single-node k3s: allow one temporary extra backend pod for faster zero-downtime rollout.
      # Memory request is sized below to keep maxSurge:1 safe while preserving the JVM-aligned limit.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: careermate-backend
  template:
    metadata:
      labels:
        app: careermate-backend
    spec:
      containers:
        - name: backend
          image: careermate/backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 18080
          envFrom:
            - secretRef:
                name: careermate-backend-env
          env:
            - name: SPRING_PROFILES_ACTIVE
              # [SkyWalking-OFF 2026-06-19] 原值: prod,skywalking-log
              value: prod
            - name: JAVA_TOOL_OPTIONS
              # [SkyWalking-OFF 2026-06-19] 已剥离 -javaagent 参数。
              # 恢复时使用下方注释的完整值：
              # value: >-
              #   -Xms512m -Xmx1280m
              #   -javaagent:/opt/skywalking-agent/skywalking-agent.jar
              #   -Dskywalking.agent.service_name=careermate-backend
              #   -Dskywalking.collector.backend_service=172.25.90.184:11800
              value: "-Xms512m -Xmx1280m"
            # [SkyWalking-OFF 2026-06-19] 临时停用，恢复时取消下方注释
            # - name: SW_LOGGING_OUTPUT
            #   value: CONSOLE
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            # [SkyWalking-OFF 2026-06-19] 临时停用，恢复时取消下方注释
            # - name: skywalking-agent
            #   mountPath: /opt/skywalking-agent
            #   readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /opt/careermate/logs/k8s-backend
            type: DirectoryOrCreate
        # [SkyWalking-OFF 2026-06-19] 临时停用，恢复时取消下方注释
        # - name: skywalking-agent
        #   hostPath:
        #     path: /opt/skywalking-agent
        #     type: Directory
