apiVersion: apps/v1
kind: Deployment
metadata:
  name: careermate-frontend
  namespace: careermate
  labels:
    app: careermate-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: careermate-frontend
  template:
    metadata:
      labels:
        app: careermate-frontend
    spec:
      containers:
        - name: frontend
          image: careermate/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
