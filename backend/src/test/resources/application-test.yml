# 集成测试专用配置：使用独立库 careermate_test_db，勿连接 dev 库 careermate_db。
# 本地首次运行测试前请创建数据库，例如：
#   createdb -h localhost -U careermate careermate_test_db
# 或通过环境变量覆盖：TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD
spring:
  datasource:
    hikari:
      maximum-pool-size: 3
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/careermate_test_db}
    username: ${TEST_DB_USERNAME:careermate}
    password: ${TEST_DB_PASSWORD:careermate}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  tracing:
    enabled: false

careermate:
  security:
    mode: single-user
    single-user:
      user-id: 1
      username: local-user
  llm:
    provider: mock
