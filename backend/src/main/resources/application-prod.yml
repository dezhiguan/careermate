aliyun:
  sms:
    mock-enabled: false

careermate:
  debug:
    llm-api-enabled: false

spring:
  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:never} # 生产日志默认关闭彩色，避免文件/聚合器出现 ANSI 乱码
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
