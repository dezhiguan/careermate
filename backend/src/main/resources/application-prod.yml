aliyun:
  sms:
    mock-enabled: false

careermate:
  debug:
    llm-api-enabled: false
  llm:
    # A1-5：非流式 LLM 调用统一走 Spring AI（DashScope），替代自研 HTTP provider；model/key 仍取 LLM_MODEL/LLM_API_KEY
    provider: spring-ai-dashscope
  agent:
    # A1 冒烟：开启 Spring AI ChatClient 框架路径，复用现有 DashScope(qwen) key
    framework:
      enabled: ${AGENT_FRAMEWORK_ENABLED:true}
      provider: ${AGENT_FRAMEWORK_PROVIDER:spring-ai-alibaba-dashscope}
      model: ${AGENT_FRAMEWORK_MODEL:${LLM_MODEL:qwen-plus}}
      api-key: ${AGENT_FRAMEWORK_API_KEY:${LLM_API_KEY:}}
    # 跨家评审(deepseek) + A3 反思 + B1 debate 生产开启；key 从 common.env 的 DEEPSEEK_API_KEY 取，
    # 缺 key 时 CrossFamilyLlmClient 静默回退主 qwen（不崩）。LTM 因架构待定，暂不开。
    secondary-llm:
      enabled: ${AGENT_SECONDARY_LLM_ENABLED:true}
    reflection:
      enabled: ${AGENT_REFLECTION_ENABLED:true}
    debate:
      enabled: ${AGENT_DEBATE_ENABLED:true}
    checkpoint:                                        # B3 断点续跑：自包含(独立 agent_run/agent_checkpoint 表)，不影响现有流程
      enabled: ${AGENT_CHECKPOINT_ENABLED:true}

spring:
  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:never} # 生产日志默认关闭彩色，避免文件/聚合器出现 ANSI 乱码
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
