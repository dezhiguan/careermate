server:
  port: ${SERVER_PORT:8081}

mybatis-plus:
  type-handlers-package: com.careermate.mybatis

spring:
  application:
    name: careermate-backend
  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:always} # always 强制彩色，IDE/重定向场景也生效；可设为 detect/never
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:300000}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml

careermate:
  security:
    mode: ${SECURITY_MODE:jwt}
    jwt:
      secret: ${JWT_SECRET:change-me-in-dev-only-change-me-in-dev-only}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    single-user:
      user-id: ${SINGLE_USER_ID:1}
      username: ${SINGLE_USER_NAME:local-user}
  llm:
    provider: ${LLM_PROVIDER:mock} # mock | deepseek | qwen | openai-compatible
    model: ${LLM_MODEL:mock-chat}
    api-key: ${LLM_API_KEY:}
    endpoint: ${LLM_ENDPOINT:}
    timeout-ms: ${LLM_TIMEOUT_MS:60000}
    max-tokens: ${LLM_MAX_TOKENS:4096}
    temperature: ${LLM_TEMPERATURE:0.7}
  debug:
    llm-api-enabled: ${CAREERMATE_DEBUG_LLM_API_ENABLED:true}
  agent:
    sse-timeout-ms: ${AGENT_SSE_TIMEOUT_MS:300000}
    executor-core-pool-size: ${AGENT_EXECUTOR_CORE_POOL_SIZE:4}
    executor-max-pool-size: ${AGENT_EXECUTOR_MAX_POOL_SIZE:20}
    executor-queue-capacity: ${AGENT_EXECUTOR_QUEUE_CAPACITY:200}
    max-concurrent-sessions: ${AGENT_MAX_CONCURRENT_SESSIONS:100}
    stream-task-timeout-ms: ${AGENT_STREAM_TASK_TIMEOUT_MS:300000}
    conversation-context-max-messages: ${AGENT_CONVERSATION_CONTEXT_MAX_MESSAGES:10}
    conversation-context-max-chars: ${AGENT_CONVERSATION_CONTEXT_MAX_CHARS:6000}
  tracing:
    service-name: ${OTEL_SERVICE_NAME:careermate-backend}
  ragforge:
    enabled: ${RAGFORGE_ENABLED:false}          # true 时才真实调用，false 时跳过（开发期不强依赖）
    url: ${RAGFORGE_URL:http://localhost:8080}
    api-key: ${RAGFORGE_API_KEY:}
    timeout-ms: ${RAGFORGE_TIMEOUT_MS:5000}
    jd-kb-id: ${RAGFORGE_JD_KB_ID:}            # RAGForge 里存放 JD 的知识库 ID
    interview-kb-id: ${RAGFORGE_INTERVIEW_KB_ID:}   # RAGForge 里存放面试题问答的知识库 ID（dev=18）
    personal-kb-id: ${RAGFORGE_PERSONAL_KB_ID:}    # RAGForge 里存放个人简历的知识库 ID（dev=15）
