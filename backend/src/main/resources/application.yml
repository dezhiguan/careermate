server:
  port: ${SERVER_PORT:8081}

mybatis-plus:
  type-handlers-package: com.careermate.mybatis

spring:
  application:
    name: careermate-backend
  ai:
    chat:
      client:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:always} # always 强制彩色，IDE/重定向场景也生效；可设为 detect/never
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:300000}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml

careermate:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-dev-only-change-me-in-dev-only}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    auth-gateway:
      base-url: ${AUTH_GATEWAY_BASE_URL:http://localhost:8090}
      issuer: ${AUTH_GATEWAY_ISSUER:https://auth.careermate.cn}
      audience: ${AUTH_GATEWAY_AUDIENCE:careermate-api}
      token-endpoint-audience: ${AUTH_GATEWAY_TOKEN_ENDPOINT_AUDIENCE:https://auth.careermate.cn/oauth/token}
      client-id: ${AUTH_GATEWAY_CLIENT_ID:careermate-backend}
      client-assertion-private-key: ${AUTH_GATEWAY_CLIENT_ASSERTION_PRIVATE_KEY:config/keys/careermate-backend.pem}
      client-assertion-kid: ${AUTH_GATEWAY_CLIENT_ASSERTION_KID:careermate-backend}
      refresh-cookie-name: ${AUTH_GATEWAY_REFRESH_COOKIE_NAME:cm_refresh}
      refresh-cookie-domain: ${AUTH_GATEWAY_REFRESH_COOKIE_DOMAIN:}
      refresh-cookie-path: ${AUTH_GATEWAY_REFRESH_COOKIE_PATH:/api/auth}
      refresh-cookie-secure: ${AUTH_GATEWAY_REFRESH_COOKIE_SECURE:true}
      timeout-ms: ${AUTH_GATEWAY_TIMEOUT_MS:3000}
    auth-events:
      hmac-secret: ${AUTH_EVENT_HMAC_SECRET:}
      signature-header: ${AUTH_EVENT_SIGNATURE_HEADER:X-Auth-Event-Signature}
      timestamp-header: ${AUTH_EVENT_TIMESTAMP_HEADER:X-Auth-Event-Timestamp}
      idempotency-ttl: ${AUTH_EVENT_IDEMPOTENCY_TTL:7d}
      revoked-jti-ttl: ${AUTH_REVOKED_JTI_TTL:7d}
      user-revocation-ttl: ${AUTH_USER_REVOCATION_TTL:30d}
    client-ip:
      # 生产环境置于 Nginx/Ingress 后时设为 true；网关须覆盖 X-Real-IP 并清洗 X-Forwarded-For，勿信任客户端直传
      trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  llm:
    provider: ${LLM_PROVIDER:mock} # mock | deepseek | qwen | openai-compatible
    model: ${LLM_MODEL:mock-chat}
    api-key: ${LLM_API_KEY:}
    endpoint: ${LLM_ENDPOINT:}
    timeout-ms: ${LLM_TIMEOUT_MS:60000}
    max-tokens: ${LLM_MAX_TOKENS:4096}
    temperature: ${LLM_TEMPERATURE:0.7}
  debug:
    llm-api-enabled: ${CAREERMATE_DEBUG_LLM_API_ENABLED:true}
  agent:
    sse-timeout-ms: ${AGENT_SSE_TIMEOUT_MS:300000}
    executor-core-pool-size: ${AGENT_EXECUTOR_CORE_POOL_SIZE:4}
    executor-max-pool-size: ${AGENT_EXECUTOR_MAX_POOL_SIZE:20}
    executor-queue-capacity: ${AGENT_EXECUTOR_QUEUE_CAPACITY:200}
    max-concurrent-sessions: ${AGENT_MAX_CONCURRENT_SESSIONS:100}
    stream-task-timeout-ms: ${AGENT_STREAM_TASK_TIMEOUT_MS:300000}
    conversation-context-max-messages: ${AGENT_CONVERSATION_CONTEXT_MAX_MESSAGES:10}
    conversation-context-max-chars: ${AGENT_CONVERSATION_CONTEXT_MAX_CHARS:6000}
    kernel:
      enabled: ${AGENT_KERNEL_ENABLED:false}
    framework:
      enabled: ${AGENT_FRAMEWORK_ENABLED:false}
      provider: ${AGENT_FRAMEWORK_PROVIDER:spring-ai-openai}
      model: ${AGENT_FRAMEWORK_MODEL:}
      base-url: ${AGENT_FRAMEWORK_BASE_URL:}
      api-key: ${AGENT_FRAMEWORK_API_KEY:}
      timeout-ms: ${AGENT_FRAMEWORK_TIMEOUT_MS:60000}
  tracing:
    service-name: ${OTEL_SERVICE_NAME:careermate-backend}
  ragforge:
    enabled: ${RAGFORGE_ENABLED:false}          # true 时才真实调用，false 时跳过（开发期不强依赖）
    url: ${RAGFORGE_URL:http://localhost:8080}
    api-key: ${RAGFORGE_API_KEY:}
    requested-audience: ${RAGFORGE_REQUESTED_AUDIENCE:ragforge-api}
    requested-scopes: ${RAGFORGE_REQUESTED_SCOPES:rag:search}
    exchanged-token-cache-ttl-ms: ${RAGFORGE_EXCHANGED_TOKEN_CACHE_TTL_MS:300000}
    timeout-ms: ${RAGFORGE_TIMEOUT_MS:1500}
    jd-kb-id: ${RAGFORGE_JD_KB_ID:}            # RAGForge 里存放 JD 的知识库 ID
    interview-kb-id: ${RAGFORGE_INTERVIEW_KB_ID:}   # RAGForge 里存放面试题问答的知识库 ID（dev=18）
    personal-kb-id: ${RAGFORGE_PERSONAL_KB_ID:}    # RAGForge 里存放个人简历的知识库 ID（dev=15）
  prompt:
    active-versions:
      resume-generate-from-jd: ${RESUME_PROMPT_VERSION:v1}
  mcp:
    enabled: ${CAREERMATE_MCP_ENABLED:false}

aliyun:
  sms:
    enabled: ${ALIYUN_SMS_ENABLED:false}
    mock-enabled: ${ALIYUN_SMS_MOCK_ENABLED:true}
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    region: ${ALIYUN_SMS_REGION:cn-hangzhou}
    endpoint: ${ALIYUN_SMS_ENDPOINT:dypnsapi.aliyuncs.com}
    phone-hash-pepper: ${ALIYUN_SMS_PHONE_HASH_PEPPER:}
    template:
      login: ${ALIYUN_SMS_TEMPLATE_CODE_LOGIN:}
      valid-minutes: ${ALIYUN_SMS_TEMPLATE_VALID_MINUTES:5}
