spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
    file:
      encoding: UTF-8
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careermate_db}
    username: ${DB_USERNAME:careermate}
    password: ${DB_PASSWORD:careermate}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 远程库链路偶发抖动时，放宽建连超时并在窗口期内重试，避免首连被掐断就直接启动失败
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT_MS:60000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

careermate:
  auth:
    sms:
      storage: ${CAREERMATE_AUTH_SMS_STORAGE:memory}
  security:
    auth-gateway:
      client-assertion-private-key: ${AUTH_GATEWAY_CLIENT_ASSERTION_PRIVATE_KEY:/Users/amy/CursorProject/auth-gateway/config/keys/auth-active.pem}
      client-assertion-kid: ${AUTH_GATEWAY_CLIENT_ASSERTION_KID:auth-active}
      refresh-cookie-secure: ${AUTH_GATEWAY_REFRESH_COOKIE_SECURE:false}
