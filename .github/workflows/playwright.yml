name: Playwright Tests (manual)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend/careermate

jobs:
  cloud-smoke:
    name: cloud-smoke-manual
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/careermate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cloud smoke
        env:
          CI: true
          E2E_TARGET: cloud
          PLAYWRIGHT_BASE_URL: ${{ vars.CAREERFORGE_BASE_URL || 'http://careerforge.cn' }}
          PLAYWRIGHT_API_BASE_URL: ${{ vars.CAREERFORGE_API_BASE_URL || 'http://careerforge.cn/api' }}
        run: npm run test:e2e:cloud:smoke

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: playwright-manual-report
          path: frontend/careermate/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: playwright-manual-results
          path: frontend/careermate/test-results/
          retention-days: 30
          if-no-files-found: ignore
