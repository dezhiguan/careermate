name: CareerMate CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careermate-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static security scan
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude '**/target' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '**/build' \
            .

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  backend-unit-test:
    name: backend-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend-build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: careermate_test_db
          POSTGRES_USER: careermate
          POSTGRES_PASSWORD: careermate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careermate -d careermate_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check backend unit test coverage
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          TEST_DB_URL: jdbc:postgresql://localhost:5432/careermate_test_db
          TEST_DB_USERNAME: careermate
          TEST_DB_PASSWORD: careermate
        run: mvn -B clean verify -Dmaven.test.failure.ignore=true

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: backend-unit-test-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: backend-unit-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  agent-eval-test:
    name: agent-eval-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Agent Eval suite
        working-directory: backend
        run: mvn -B -Dtest=com.careermate.agent.eval.AgentEvalTest test

      - name: Upload Agent Eval reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: agent-eval-reports
          path: |
            backend/target/agent-eval-report.json
            backend/target/agent-eval-report.md
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/careermate/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/careermate
        run: npm ci

      - name: Build frontend
        working-directory: frontend/careermate
        env:
          VITE_API_BASE_URL: /api
          VITE_BASE_PATH: /
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-frontend-dist
          path: frontend/careermate/dist
          if-no-files-found: error

  deploy-k3s-server3:
    name: deploy-k3s-server3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs:
      - backend-build
      - backend-unit-test
      - agent-eval-test
      - frontend-build
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-backend-jar

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-frontend-dist
          path: frontend/careermate/dist

      - name: Configure SSH (Server 3)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_APP_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_APP_PORT }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
          JUMP_USER: ${{ secrets.CAREERMATE_INGRESS_USER }}
          JUMP_PORT: ${{ secrets.CAREERMATE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_APP_SSH_KEY and CAREERMATE_APP_HOST must be set"
            exit 1
          fi
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_APP_USER must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          JUMP_USER="${JUMP_USER:-root}"
          JUMP_PORT="${JUMP_PORT:-22}"
          ssh-keyscan -p "${JUMP_PORT}" "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host careermate-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' "  User ${JUMP_USER}"
            printf '%s\n' "  Port ${JUMP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 30'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' ''
            printf '%s\n' 'Host careermate-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 30'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' '  ProxyJump careermate-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync repository to Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          RSYNC_SSH="ssh -F ${HOME}/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"

          ssh "${SSH_OPTS[@]}" careermate-app "mkdir -p /opt/careermate/k8s-src"

          timeout 15m rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'backend/target' \
            --exclude 'backend/src/test/' \
            --exclude 'frontend/careermate/node_modules' \
            --exclude 'frontend/careermate/tests/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            -e "${RSYNC_SSH}" \
            ./ \
            careermate-app:/opt/careermate/k8s-src/

      - name: Upload backend JAR to Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          SCP_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          JAR_FILE="$(find . -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR artifact found after download"
            exit 1
          fi
          ssh "${SSH_OPTS[@]}" careermate-app \
            "mkdir -p /opt/careermate/k8s-src/backend/target"
          scp "${SCP_OPTS[@]}" "${JAR_FILE}" \
            "careermate-app:/opt/careermate/k8s-src/backend/target/careermate-backend-0.1.0.jar"

      - name: Transfer SkyWalking images to Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          SCP_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          IMAGES=(
            apache/skywalking-banyandb:0.8.0
            apache/skywalking-oap-server:10.2.0
            apache/skywalking-ui:10.2.0
          )
          for image in "${IMAGES[@]}"; do
            docker pull "${image}"
          done
          docker save "${IMAGES[@]}" | gzip > /tmp/skywalking-images.tar.gz
          scp "${SCP_OPTS[@]}" /tmp/skywalking-images.tar.gz careermate-app:/tmp/skywalking-images.tar.gz
          ssh "${SSH_OPTS[@]}" careermate-app \
            "gunzip -c /tmp/skywalking-images.tar.gz | sudo docker load && rm -f /tmp/skywalking-images.tar.gz"

      - name: Ensure SkyWalking OAP + UI on Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          timeout 15m ssh "${SSH_OPTS[@]}" careermate-app \
            "cd /opt/careermate/k8s-src && sudo env SKYWALKING_BIND_IP=172.25.90.184 SKIP_PULL=1 bash deploy/scripts/ensure-skywalking-stack.sh"

      - name: Deploy CareerMate to k3s on Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          timeout 35m ssh "${SSH_OPTS[@]}" careermate-app \
            "cd /opt/careermate/k8s-src && sudo env SKIP_BACKEND_BUILD=1 SKIP_FRONTEND_BUILD=1 bash deploy/scripts/deploy-careermate-k8s.sh"

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs:
      - deploy-k3s-server3
    steps:
      - name: API health check
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          BODY="$(curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${BASE}/api/health")"
          python3 - <<'PY' "${BODY}"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data["data"]["status"] == "UP", data
          trace_id = data.get("traceId")
          assert trace_id, f"traceId must be non-null, got: {trace_id!r}"
          PY

      - name: API auth traceId check (401)
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          RESP="$(curl --silent --show-error --max-time 10 --retry 6 --retry-delay 5 -i \
            "${BASE}/api/auth/me")"
          python3 - <<'PY' "${RESP}"
          import json, sys
          raw = sys.argv[1]
          headers, _, body = raw.partition("\r\n\r\n")
          if not body:
              headers, _, body = raw.partition("\n\n")
          assert "x-trace-id:" in headers.lower(), headers
          data = json.loads(body)
          assert data.get("code") == 401, data
          trace_id = data.get("traceId")
          assert trace_id, f"traceId must be non-null, got: {trace_id!r}"
          PY

      - name: SkyWalking UI check
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          RESP="$(curl --silent --show-error --max-time 10 --retry 12 --retry-delay 10 -i \
            "${BASE%/}/skywalking/")"
          python3 - <<'PY' "${RESP}"
          import sys
          raw = sys.argv[1]
          status_line = raw.split("\n", 1)[0]
          assert " 200 " in status_line or " 302 " in status_line, status_line
          PY

      - name: Frontend entry check
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${BASE}/" | grep -q '<html'
