      - name: Deploy CareerMate to k3s on Server 3
        env:
          BACKEND_IMAGE: ${{ steps.acr-images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.acr-images.outputs.frontend }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          ACR_PASSWORD_B64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          timeout 35m ssh "${SSH_OPTS[@]}" careermate-app \
            "BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${ACR_PASSWORD_B64}' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/careermate/k8s-src
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          sudo env \
            USE_REMOTE_IMAGES=1 \
            SKIP_IMAGE_BUILD=1 \
            CAREERMATE_BACKEND_IMAGE="${BACKEND_IMAGE}" \
            CAREERMATE_FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
            ACR_REGISTRY="${ACR_REGISTRY}" \
            ACR_USERNAME="${ACR_USERNAME}" \
            ACR_PASSWORD="${ACR_PASSWORD}" \
            bash deploy/scripts/deploy-careermate-k8s.sh
          EOF

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs:
      - deploy-k3s-server3
    steps:
      - name: API health check
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          BODY="$(curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${BASE}/api/health")"
          python3 - <<'PY' "${BODY}"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data["data"]["status"] == "UP", data
          trace_id = data.get("traceId")
          assert trace_id, f"traceId must be non-null, got: {trace_id!r}"
          PY

      - name: API auth traceId check (401)
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          RESP="$(curl --silent --show-error --max-time 10 --retry 6 --retry-delay 5 -i \
            "${BASE}/api/auth/me")"
          python3 - <<'PY' "${RESP}"
          import json, sys
          raw = sys.argv[1]
          headers, _, body = raw.partition("\r\n\r\n")
          if not body:
              headers, _, body = raw.partition("\n\n")
          assert "x-trace-id:" in headers.lower(), headers
          data = json.loads(body)
          assert data.get("code") == 401, data
          trace_id = data.get("traceId")
          assert trace_id, f"traceId must be non-null, got: {trace_id!r}"
          PY

      # [SkyWalking-OFF 2026-06-19] SkyWalking server 容器已停，临时跳过 UI smoke check。
