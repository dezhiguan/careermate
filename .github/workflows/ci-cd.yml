      #     raw = sys.argv[1]
      #     status_line = raw.split("\n", 1)[0]
      #     assert " 200 " in status_line or " 302 " in status_line, status_line
      #     PY

      - name: Frontend entry check
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${BASE}/" | grep -q '<html'
