name: CareerMate CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careermate-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run static security scan
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude '**/target' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '**/build' \
            .

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: careermate-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  backend-unit-test:
    name: backend-unit-test
    # [BackendUnitTest-OFF 2026-06-19] 临时置灰，CI 上会显示为 skipped。
    # [BackendUnitTest-OFF 2026-06-19] 恢复方法：删除下方 `if: false` 这一行即可。
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend-build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: careermate_test_db
          POSTGRES_USER: careermate
          POSTGRES_PASSWORD: careermate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careermate -d careermate_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check backend unit test coverage
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          TEST_DB_URL: jdbc:postgresql://localhost:5432/careermate_test_db
          TEST_DB_USERNAME: careermate
          TEST_DB_PASSWORD: careermate
        run: mvn -B clean verify -Dmaven.test.failure.ignore=true

      - name: Upload backend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: backend-unit-test-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload backend test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: backend-unit-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  agent-eval-test:
    name: agent-eval-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend-build
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Agent Eval suite
        working-directory: backend
        run: mvn -B -Dtest=com.careermate.agent.eval.AgentEvalTest test

      - name: Upload Agent Eval reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: agent-eval-reports
          path: |
            backend/target/agent-eval-report.json
            backend/target/agent-eval-report.md
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/careermate/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/careermate
        run: npm ci

      - name: Build frontend
        working-directory: frontend/careermate
        env:
          VITE_API_BASE_URL: /api
          VITE_BASE_PATH: /
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: careermate-frontend-dist
          path: frontend/careermate/dist
          if-no-files-found: error

  deploy-k3s-server3:
    name: deploy-k3s-server3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs:
      - backend-build
      # [BackendUnitTest-OFF 2026-06-19] 临时置灰 backend-unit-test，恢复时取消下一行注释
      # - backend-unit-test
      - agent-eval-test
      - frontend-build
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download backend JAR artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: careermate-backend-jar

      - name: Download frontend dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: careermate-frontend-dist
          path: frontend/careermate/dist

      - name: Resolve ACR image names
        id: acr-images
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          if [[ -z "${ACR_REGISTRY}" ]]; then
            echo "ACR_REGISTRY must be set"
            exit 1
          fi
          PULL_REGISTRY="${ACR_REGISTRY%/}"
          PUSH_REGISTRY="${ACR_PUBLIC_REGISTRY:-${PULL_REGISTRY/-vpc./.}}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "server=${PUSH_REGISTRY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "push_backend=${PUSH_REGISTRY}:backend-${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "push_frontend=${PUSH_REGISTRY}:frontend-${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "backend=${PULL_REGISTRY}:backend-${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${PULL_REGISTRY}:frontend-${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login to ACR
        env:
          ACR_SERVER: ${{ steps.acr-images.outputs.server }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [[ -z "${ACR_USERNAME}" || -z "${ACR_PASSWORD}" ]]; then
            echo "ACR_USERNAME and ACR_PASSWORD must be set"
            exit 1
          fi
          printf '%s' "${ACR_PASSWORD}" | docker login "${ACR_SERVER}" -u "${ACR_USERNAME}" --password-stdin

      - name: Build and push images to ACR
        env:
          BACKEND_IMAGE: ${{ steps.acr-images.outputs.push_backend }}
          FRONTEND_IMAGE: ${{ steps.acr-images.outputs.push_frontend }}
        run: |
          JAR_FILE="$(find . -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR artifact found after download"
            exit 1
          fi
          mkdir -p backend/target
          cp "${JAR_FILE}" backend/target/careermate-backend-0.1.0.jar
          docker build -f backend/Dockerfile -t "${BACKEND_IMAGE}" backend/
          docker push "${BACKEND_IMAGE}"
          docker build -f frontend/careermate/Dockerfile --target runtime-prebuilt -t "${FRONTEND_IMAGE}" .
          docker push "${FRONTEND_IMAGE}"

      - name: Configure SSH (Server 3)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_APP_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_APP_PORT }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
          JUMP_USER: ${{ secrets.CAREERMATE_INGRESS_USER }}
          JUMP_PORT: ${{ secrets.CAREERMATE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_APP_SSH_KEY and CAREERMATE_APP_HOST must be set"
            exit 1
          fi
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_APP_USER must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          JUMP_USER="${JUMP_USER:-root}"
          JUMP_PORT="${JUMP_PORT:-22}"
          ssh-keyscan -p "${JUMP_PORT}" "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host careermate-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' "  User ${JUMP_USER}"
            printf '%s\n' "  Port ${JUMP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 30'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' ''
            printf '%s\n' 'Host careermate-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 30'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' '  ProxyJump careermate-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync repository to Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          RSYNC_SSH="ssh -F ${HOME}/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"

          ssh "${SSH_OPTS[@]}" careermate-app "mkdir -p /opt/careermate/k8s-src"

          timeout 15m rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'backend/target' \
            --exclude 'backend/src/test/' \
            --exclude 'frontend/careermate/node_modules' \
            --exclude 'frontend/careermate/tests/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            -e "${RSYNC_SSH}" \
            ./ \
            careermate-app:/opt/careermate/k8s-src/

      - name: Upload backend JAR to Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          SCP_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          JAR_FILE="$(find . -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR artifact found after download"
            exit 1
          fi
          ssh "${SSH_OPTS[@]}" careermate-app \
            "mkdir -p /opt/careermate/k8s-src/backend/target"
          scp "${SCP_OPTS[@]}" "${JAR_FILE}" \
            "careermate-app:/opt/careermate/k8s-src/backend/target/careermate-backend-0.1.0.jar"

      # [SkyWalking-OFF 2026-06-19] 临时停用 SkyWalking 集成以缩短部署耗时。
      # 恢复方法：grep 'SkyWalking-OFF 2026-06-19' 找到所有点，取消下方注释即可。
