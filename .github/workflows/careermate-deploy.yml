name: CareerMate Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: careermate-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careermate_db
          POSTGRES_USER: careermate
          POSTGRES_PASSWORD: careermate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careermate -d careermate_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/careermate_db
      DB_USERNAME: careermate
      DB_PASSWORD: careermate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/careermate/package-lock.json

      - name: Build frontend
        working-directory: frontend/careermate
        env:
          VITE_API_BASE_URL: /careermate-api
          VITE_BASE_PATH: /careermate/
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-frontend-dist
          path: frontend/careermate/dist
          if-no-files-found: error

  package-release:
    name: package-release
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build
    steps:
      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-backend-jar

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-frontend-dist
          path: _frontend-dist

      - name: Assemble release directory
        run: |
          mkdir -p release/backend release/frontend/dist
          JAR_FILE="$(find . -maxdepth 2 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "Downloaded backend JAR not found"
            exit 1
          fi
          cp "${JAR_FILE}" release/backend/app.jar
          cp -a _frontend-dist/. release/frontend/dist/
          test -f release/frontend/dist/index.html
          test -f release/backend/app.jar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-release
          path: release
          if-no-files-found: error

  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    needs: package-release
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-release
          path: release

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_DEPLOY_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_DEPLOY_SSH_KEY and CAREERMATE_DEPLOY_HOST must be set"
            exit 1
          fi
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_DEPLOY_USER must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload release to server
        env:
          DEPLOY_HOST: ${{ secrets.CAREERMATE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_DEPLOY_PORT }}
        run: |
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_DEPLOY_USER must be set"
            exit 1
          fi
          PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT}" -o StrictHostKeyChecking=yes)
          SCP_OPTS=(-i ~/.ssh/deploy_key -P "${PORT}" -o StrictHostKeyChecking=yes)
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=yes"
          RELEASE_DIR="/opt/careermate/releases/${GITHUB_SHA}"

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${RELEASE_DIR}/backend' '${RELEASE_DIR}/frontend/dist' /opt/careermate/scripts"

          scp "${SCP_OPTS[@]}" release/backend/app.jar \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/backend/app.jar"

          rsync -avz -e "${RSYNC_SSH}" \
            release/frontend/dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/frontend/dist/"

          scp "${SCP_OPTS[@]}" deploy/scripts/deploy-from-github.sh deploy/scripts/rollback-careermate.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/careermate/scripts/"

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x /opt/careermate/scripts/deploy-from-github.sh /opt/careermate/scripts/rollback-careermate.sh"

      - name: Activate release on server
        env:
          DEPLOY_HOST: ${{ secrets.CAREERMATE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_DEPLOY_PORT }}
        run: |
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_DEPLOY_USER must be set"
            exit 1
          fi
          PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT}" -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo bash /opt/careermate/scripts/deploy-from-github.sh '${GITHUB_SHA}'"

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: API health check
        run: curl -fsS http://8.163.63.222/careermate-api/health

      - name: Frontend entry check
        run: |
          curl -fsS http://8.163.63.222/careermate/ | grep -q 'CareerMate'
