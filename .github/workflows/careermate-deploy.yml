name: CareerMate Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: careermate-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/careermate/package-lock.json

      - name: Build frontend
        working-directory: frontend/careermate
        env:
          VITE_API_BASE_URL: /api
          VITE_BASE_PATH: /
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: careermate-frontend-dist
          path: frontend/careermate/dist
          if-no-files-found: error

  deploy-app:
    name: deploy-app-server3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-build
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-backend-jar

      - name: Configure SSH (Server 3)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_APP_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_APP_PORT }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
          JUMP_USER: ${{ secrets.CAREERMATE_INGRESS_USER }}
          JUMP_PORT: ${{ secrets.CAREERMATE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_APP_SSH_KEY and CAREERMATE_APP_HOST must be set"
            exit 1
          fi
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_APP_USER must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          JUMP_USER="${JUMP_USER:-root}"
          JUMP_PORT="${JUMP_PORT:-22}"
          ssh-keyscan -p "${JUMP_PORT}" "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host careermate-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' "  User ${JUMP_USER}"
            printf '%s\n' "  Port ${JUMP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 30'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' ''
            printf '%s\n' 'Host careermate-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 30'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' '  ProxyJump careermate-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload backend to Server 3
        run: |
          RELEASE_DIR="/opt/careermate/releases/${GITHUB_SHA}"
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          SCP_OPTS=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)

          ssh "${SSH_OPTS[@]}" careermate-app \
            "mkdir -p '${RELEASE_DIR}/backend' /opt/careermate/scripts /opt/careermate/deploy/scripts /opt/careermate/deploy/skywalking /opt/careermate/deploy/nginx"

          scp "${SCP_OPTS[@]}" "$(find . -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)" \
            "careermate-app:${RELEASE_DIR}/backend/app.jar"

          scp "${SCP_OPTS[@]}" backend/Dockerfile \
            "careermate-app:${RELEASE_DIR}/backend/Dockerfile"

          scp "${SCP_OPTS[@]}" docker-compose-backend.yml \
            "careermate-app:/opt/careermate/docker-compose-backend.yml"

          scp "${SCP_OPTS[@]}" deploy/scripts/deploy-from-github.sh deploy/scripts/rollback-careermate.sh \
            "careermate-app:/opt/careermate/scripts/"

          scp "${SCP_OPTS[@]}" deploy/scripts/start-skywalking.sh deploy/scripts/install-skywalking-agent.sh \
            "careermate-app:/opt/careermate/deploy/scripts/"

          scp "${SCP_OPTS[@]}" deploy/skywalking/docker-compose.skywalking.yml \
            "careermate-app:/opt/careermate/deploy/skywalking/"

          scp "${SCP_OPTS[@]}" deploy/nginx/skywalking.locations.example \
            "careermate-app:/opt/careermate/deploy/nginx/"

          ssh "${SSH_OPTS[@]}" careermate-app \
            "chmod +x /opt/careermate/scripts/deploy-from-github.sh /opt/careermate/scripts/rollback-careermate.sh /opt/careermate/deploy/scripts/start-skywalking.sh /opt/careermate/deploy/scripts/install-skywalking-agent.sh"

      - name: Activate release on Server 3
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          timeout 20m ssh "${SSH_OPTS[@]}" careermate-app \
            "sudo -n env HEALTH_MAX_ATTEMPTS=60 HEALTH_SLEEP_SECS=3 bash /opt/careermate/scripts/deploy-from-github.sh '${GITHUB_SHA}'"

  deploy-ingress:
    name: deploy-ingress-server2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend-build
    steps:
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: careermate-frontend-dist
          path: frontend-dist

      - name: Configure SSH (Server 2)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_INGRESS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_INGRESS_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_INGRESS_SSH_KEY and CAREERMATE_INGRESS_HOST must be set"
            exit 1
          fi
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "CAREERMATE_INGRESS_USER must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload frontend to Server 2
        env:
          DEPLOY_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
          DEPLOY_USER: ${{ secrets.CAREERMATE_INGRESS_USER }}
          DEPLOY_PORT: ${{ secrets.CAREERMATE_INGRESS_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT}" -T -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          FRONTEND_TARGET="/opt/rag-forge/frontend/dist/careerforge"

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${FRONTEND_TARGET}'"

          timeout 10m rsync -avz --delete -e "${RSYNC_SSH}" \
            frontend-dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${FRONTEND_TARGET}/"

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - deploy-app
      - deploy-ingress
    steps:
      - name: API health check
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${{ vars.CAREERFORGE_API_BASE_URL || 'https://careerforge.cn/api' }}/health"

      - name: Frontend entry check
        run: |
          BASE="${{ vars.CAREERFORGE_BASE_URL || 'https://careerforge.cn' }}"
          if curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${BASE}/careerforge/" | grep -q 'CareerMate'; then
            echo "Frontend entry OK: ${BASE}/careerforge/"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 \
            "${BASE}/" | grep -q 'CareerMate'
